# Batch Connect node proxy for the Open OnDemand portal.
#
# Reverse proxies authenticated portal users to the web servers that Batch
# Connect jobs start on compute nodes:
#
#   /node/HOST/PORT/...  -> http://HOST:PORT/node/HOST/PORT/...   (absolute URIs)
#   /rnode/HOST/PORT/... -> http://HOST:PORT/...                  (relative URIs)
#
# This is the standard mod_ood_proxy configuration (see
# /opt/ood/mod_ood_proxy/lib/node_proxy.lua and the ood-portal-generator
# template ood-portal.conf.erb); the ondemand Apache template ships without
# these blocks, so the dashboard's "Connect" button would 404 without them.
#
# DeepOps: installed by roles/ood-wrapper (playbooks/ood-portal.yml).
# Do not edit by hand; change the role's source and rerun it.

# Reverse proxy traffic to backend webserver through IP sockets (absolute):
#
#     http://master:80/node/HOST/PORT/index.html
#     #=> http://HOST:PORT/node/HOST/PORT/index.html
#
<LocationMatch "^/node/(?<host>[^/]+)/(?<port>\d+)">
  AuthType Basic
  AuthName "private"
  AuthUserFile "/etc/httpd/.htpasswd"
  RequestHeader unset Authorization
  Require valid-user

  # ProxyPassReverse implementation
  Header edit Location "^[^/]+//[^/]+" ""

  # ProxyPassReverseCookieDomain implementation (strip domain)
  Header edit* Set-Cookie ";\s*(?i)Domain[^;]*" ""

  # ProxyPassReverseCookiePath implementation
  Header edit* Set-Cookie ";\s*(?i)Path[^;]*" ""
  Header edit  Set-Cookie "^([^;]+)" "$1; Path=/node/%{MATCH_HOST}e/%{MATCH_PORT}e"

  LuaHookFixups node_proxy.lua node_proxy_handler
</LocationMatch>

# Reverse "relative" proxy traffic to backend webserver through IP sockets:
#
#     http://master:80/rnode/HOST/PORT/index.html
#     #=> http://HOST:PORT/index.html
#
<LocationMatch "^/rnode/(?<host>[^/]+)/(?<port>\d+)(?<uri>/.*|)">
  AuthType Basic
  AuthName "private"
  AuthUserFile "/etc/httpd/.htpasswd"
  RequestHeader unset Authorization
  Require valid-user

  # ProxyPassReverse implementation
  Header edit Location "^([^/]+//[^/]+)|(?=/)|^([\./]{1,}(?<!/))" "/rnode/%{MATCH_HOST}e/%{MATCH_PORT}e"

  # ProxyPassReverseCookieDomain implementation (strip domain)
  Header edit* Set-Cookie ";\s*(?i)Domain[^;]*" ""

  # ProxyPassReverseCookiePath implementation
  Header edit* Set-Cookie ";\s*(?i)Path[^;]*" ""
  Header edit  Set-Cookie "^([^;]+)" "$1; Path=/rnode/%{MATCH_HOST}e/%{MATCH_PORT}e"

  LuaHookFixups node_proxy.lua node_proxy_handler
</LocationMatch>
