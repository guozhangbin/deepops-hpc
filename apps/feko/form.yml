---
# Widgets must be valid for OOD 4.2's BootstrapForm builder (e.g. text_field,
# text_area, select, check_box, radio). "number" and "text" are NOT valid and
# 500 the form render.
cluster:
  - "deepops"
form:
  - nodes
  - cores
  - gpus
  - walltime
  - memory
  - nodelist
  - module
  - command
  - additional_environment
attributes:
  nodes:
    label: "Nodes"
    widget: "text_field"
    value: "1"
  cores:
    label: "Cores per node"
    widget: "text_field"
    value: "4"
  gpus:
    label: "GPUs"
    widget: "text_field"
    default: 0
    help: "Number of GPUs to allocate (0 for CPU-only)"
  walltime:
    label: "Max run time (HH:MM:SS)"
    widget: "text_field"
    value: "08:00:00"
    help: "Job walltime limit; the session is killed when it elapses"
  memory:
    label: "Memory per node (GB)"
    widget: "text_field"
    value: "0"
    help: "0 = cluster default. Otherwise passed to sbatch as --mem <value>G"
  nodelist:
    label: "Node list (optional)"
    widget: "text_field"
    help: "Restrict the job to specific nodes (sbatch -w), e.g. gpu01. Empty = any eligible node."
  module:
    label: "Environment module (optional)"
    widget: "text_field"
    help: "Module to load before launch, e.g. feko/2025 (CHPC auto_modules_* pattern). Empty = use PATH."
  command:
    label: "Launch command"
    widget: "text_field"
    value: "feko"
    help: "Command executed inside the VNC session; override if the launcher binary has a different name"
  additional_environment:
    label: "Additional environment (optional)"
    widget: "text_area"
    help: "Extra shell lines run before launch: exports, module loads, tool flags. One command per line."
