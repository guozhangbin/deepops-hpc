---
name: ANSYS Fluent
category: 交互式应用
subcategory: 工程软件
role: batch_connect
description: |
  Launch ANSYS Fluent in a VNC session on a compute node of
  the UltraLAB HPC cluster (Slurm). The session runs as a Slurm batch job;
  interact with the GUI through the browser (noVNC).

  The licensed software installation must be available on the compute node
  (see README.md).
